name: echo_app
description: Project Echo 客户端 - 为脑卒中后失语症患者提供语音补全与图片转述。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.0
  image_picker: ^1.1.0
  record: ^5.1.0
  audioplayers: ^6.0.0
  path_provider: ^2.1.0
  path: ^1.9.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
